[Service]
# Worker-level backstop (MACH-62). Per-job caps come from the worker [memory]
# config (high/max/swap_max in the lane's worker-<lane>.toml), which the runner
# applies as a memory-limited cgroup scope per job; this drop-in only keeps a
# runaway lane from taking the host. A kernel OOM kill inside a job must not
# stop the unit.
# Delegate=yes is required: the per-job scopes are created in the lane worker's
# own cgroup subtree, and systemd only lets the worker manage that subtree when
# its cgroup is delegated.
OOMPolicy=continue
Delegate=yes
MemoryHigh=10G
MemoryMax=12G
MemorySwapMax=2G
[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

# API authentication. Default "tokens" requires scoped bearer tokens for
# machine clients (create with `machinist tokens create --name bot --scope write`,
# or from the Settings page). Tokens are stored hashed in the server database
# and must live in your bot's environment — never in this file or any
# repository. "none" opts out and is only allowed on a loopback or trusted
# Tailscale interface; it logs a startup warning.
# auth = "tokens"

# The MCP endpoint (streamable HTTP) is served at /mcp on the same listener;
# see docs/mcp.md.

# Library profile used when a repository has no .machinist/review.yaml and no
# per-project choice in Settings. Set to "dan-pr-review" for Daniel's projects
# after installing his reviewer skills; otherwise the shipped default runs.
# [review]
# default_profile = "dan-pr-review"

# Factory setup: the tracker, coding agent, review agent and per-role models a
# project uses. Set it per project in Settings, or here for the whole instance
# or a single project. First match wins: project setting in Settings > global
# default in Settings > [factory.projects.NAME] > [factory.default] > built-in
# (empty, so the trigger and command keep their own agent and model). Each role
# is "coding", "review" or "non_coding". A tracker still needs that project's
# connection in [issue_sources.plane] / [issue_sources.linear]. Secrets never
# belong in this file: use {{env.NAME}} in a review command and it resolves from
# the worker's environment. See docs/configuration.md#factory-setup.
#
# [factory.default]
# tracker = "plane"
# coding_agent = { kind = "omp", executor = "omp" }
# review_agent = { kind = "codex", command = "codex exec --model {{model}}" }
#
# [factory.default.models.coding]
# model = "glm-4.6"
# effort = "high"
# endpoint = "local"
# url = "http://spark:8080"
#
# Linear, Codex coding and a cloud review model, plus a custom review command,
# for one project only. Repository names are worker repository names, "codex"
# is a worker executor, and its models table must list the coding alias used.
# [factory.projects.my-project]
# tracker = "linear"
# coding_agent = { kind = "codex", executor = "codex" }
# review_agent = { kind = "command", command = "my-reviewer --model {{model}} --api-key {{env.MY_REVIEWER_API_KEY}}" }
#
# [factory.projects.my-project.models.review]
# model = "gpt-5"
# effort = "high"
# endpoint = "cloud"

# Take a task or GitHub issue to a reviewed pull request.
[commands.task-to-pr]
executor = "codex"
prompt_file = "prompts/task-to-pr.md"
timeout = "120m"

# Find verified correctness bugs and report them as GitHub issues.
[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

# Queue task-to-pr when an issue is labelled machinist:requested, and audit weekly.
# Each repository name must also exist in worker.toml.
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.github.issue-intake]
# every = "5m"
# label = "machinist:requested"
# command = "task-to-pr"
#
# [triggers.cron.weekly-audit]
# schedule = "0 6 * * 1"
# timezone = "UTC"
# repository = "my-project"
# command = "audit"
# prompt = "Audit the repository for high-confidence correctness bugs."

[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

# API authentication. Default "tokens" requires scoped bearer tokens for
# machine clients (create with `machinist tokens create --name bot --scope write`,
# or from the Settings page). Tokens are stored hashed in the server database
# and must live in your bot's environment — never in this file or any
# repository. "none" opts out and is only allowed on a loopback or trusted
# Tailscale interface; it logs a startup warning.
# auth = "tokens"

# The MCP endpoint (streamable HTTP) is served at /mcp on the same listener;
# see docs/mcp.md.

# Library profile used when a repository has no .machinist/review.yaml and no
# per-project choice in Settings. Set to "dan-pr-review" for Daniel's projects
# after installing his reviewer skills; otherwise the shipped default runs.
# [review]
# default_profile = "dan-pr-review"

# Take a task or GitHub issue to a reviewed pull request.
[commands.task-to-pr]
executor = "codex"
prompt_file = "prompts/task-to-pr.md"
timeout = "120m"

# Find verified correctness bugs and report them as GitHub issues.
[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

# Models and providers. Machinist resolves the agent and model for every run
# and passes them to the executor, so wrappers hardcode no model. Resolution
# order, highest first: explicit request or Plane-style label override
# (model:<alias>, agent:<name>) > stage (MACH-43) > job type > project >
# defaults. Only the env var name of an API key belongs here, never its value.

# [providers.sparks]            # local openai-compatible server (sglang, vLLM)
# kind = "openai-compatible"
# base_url = "http://gpu-host.example:8000/v1"
# api_key_env = "SPARKS_API_KEY"
#
# [providers.cloud]             # hosted provider
# kind = "anthropic"
# base_url = "https://api.your-provider.example"
# api_key_env = "CLOUD_API_KEY"
#
# [models.local-default]
# provider = "sparks"
# id = "deepseek-v4.1-flash"
#
# [models.cloud-large]
# provider = "cloud"
# id = "your-cloud-model"
#
# [defaults]
# agent = "omp"
# model = "local-default"
#
# Per-project and per-job-type overrides select a different model without
# editing any script. Changing the model for one project is a one-line edit:
# [projects.MYPROJECT]
# model = "cloud-large"
#
# [job_types.build-pr]
# model = "cloud-large"

# Queue task-to-pr when an issue is labelled machinist:requested, and audit weekly.
# Each repository name must also exist in worker.toml.
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.github.issue-intake]
# every = "5m"
# label = "machinist:requested"
# command = "task-to-pr"
#
# [triggers.cron.weekly-audit]
# schedule = "0 6 * * 1"
# timezone = "UTC"
# repository = "my-project"
# command = "audit"
# prompt = "Audit the repository for high-confidence correctness bugs."

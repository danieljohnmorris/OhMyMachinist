[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

# Library profile used when a repository has no .machinist/review.yaml and no
# per-project choice in Settings. Set to "dan-pr-review" for Daniel's projects
# after installing his reviewer skills; otherwise the shipped default runs.
# [review]
# default_profile = "dan-pr-review"

# Take a task or GitHub issue to a reviewed pull request.
[commands.task-to-pr]
executor = "codex"
prompt_file = "prompts/task-to-pr.md"
timeout = "120m"

# Find verified correctness bugs and report them as GitHub issues.
[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

# Queue task-to-pr when an issue is labelled machinist:requested, and audit weekly.
# Each repository name must also exist in worker.toml.
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.github.issue-intake]
# every = "5m"
# label = "machinist:requested"
# command = "task-to-pr"
#
# [triggers.cron.weekly-audit]
# schedule = "0 6 * * 1"
# timezone = "UTC"
# repository = "my-project"
# command = "audit"
# prompt = "Audit the repository for high-confidence correctness bugs."

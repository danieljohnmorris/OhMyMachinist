name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: internal/controlplane/web/package-lock.json
      - name: Test issue triage
        run: node --test .github/scripts/issue-triage.test.cjs
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.26.6"
      - name: Install frontend dependencies
        working-directory: internal/controlplane/web
        run: npm ci
      - name: Test frontend
        working-directory: internal/controlplane/web
        run: npm test
      - name: Build frontend
        working-directory: internal/controlplane/web
        run: npm run build
      - name: Check tracked frontend is current
        run: |
          git diff --exit-code -- internal/controlplane/web/dist
          test -z "$(git status --porcelain --untracked-files=all -- internal/controlplane/web/dist)"
      - name: Check Go formatting
        shell: bash
        run: |
          gofmt -l $(git ls-files '*.go') | tee /tmp/unformatted-go-files
          test ! -s /tmp/unformatted-go-files
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Run review profile tests (Python)
        working-directory: deploy/factory
        run: python3 -m unittest review.test_profiles
      - name: Build Machinist
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=ci" -o bin/machinist ./cmd/machinist
          test -x bin/machinist
          test "$(bin/machinist version)" = "ci"

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.26.6"
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Build Machinist
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=ci" -o bin/machinist ./cmd/machinist
          test -x bin/machinist
          test "$(bin/machinist version)" = "ci"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the tree with gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --verbose

  check:
    name: check
    if: always()
    needs:
      - linux
      - macos
      - secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform check
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
